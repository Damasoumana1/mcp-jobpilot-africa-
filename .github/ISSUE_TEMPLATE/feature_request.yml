name: "✨ Feature Request"
description: "Suggest an idea or enhancement for MCP JobPilot Africa"
title: "[FEAT]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting a new feature for JobPilot Africa!"
  - type: textarea
    id: problem
    attributes:
      label: "What problem does this feature solve?"
      description: "A clear and concise description of the challenge."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "How would you like this to be implemented or look?"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Affected Component"
      options:
        - "Backend (MCP Tools & Services)"
        - "Frontend (React & Tailwind UI)"
        - "Database & Datasets (Jobs / Candidates)"
        - "Matching Algorithm"
        - "Documentation"
    validations:
      required: true
